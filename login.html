<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Subin T S">
    <meta name="keywords" content="HTML CSS Bootstrap JavaScript">
    <meta name="description"
        content="FetchStore App is a simple frontend e-commerce application built with HTML, CSS, and JavaScript. It uses Fetch API to display products, includes a login system, and follows a professional Git workflow with feature-based branching.">

    <title>FetchStore - Login Page</title>

    <!-- Bootstrap CDN Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Fontawesome Link -->
    <script src="https://kit.fontawesome.com/bb121f03f5.js" crossorigin="anonymous"></script>

    <!-- AOS Link -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- External Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- Header section -->
    <header>
        <!-- navbar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container py-2">
                <a class="navbar-brand fw-bold" href="index.html">FetchStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="about.html">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="service.html">Our Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="signup.html">Signup</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="login.html">Login</a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>
    <!-- Header section ends-->

    <!-- main section -->
    <main>
        <div class="login-container">
            <h1 class="login-title">Login</h1>

            <div class="login-form-container" data-aos="zoom-in">
               
                    <div class="form-input-group">
                        <label for="email">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="example@mail.com"
                            required>
                    </div>
                    <div class="form-input-group">
                        <label for="password">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password"
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$" 
                            title="Must contain uppercase, lowercase, number, and special character"
                            minlength="8"
                            maxlength="16"
                            placeholder="********"
                            required>
                    </div>
                    <div>
                        <button class="btn btn-small btn-success w-100 mb-3" id="loginButton">Login</button>

                    </div>

                    <div class="d-flex flex-row justify-content-between">
                        <a href="index.html" class="text-secondary">Back to Home</a>
                        <a href="signup.html" class="text-light  ">Register</a>
                    </div>

               
            </div>

        </div>
    </main>
    <!-- main section ends -->

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- AOS JS  -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

    <!-- External Custom JS  -->
    <script src="js/scripts.js"></script>
</body>

</html>
